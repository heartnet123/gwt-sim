<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goldak Welding Thermal Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      margin: 0;
      background: #111;
      color: #fff;
    }
    #canvasContainer {
      width: 100%;
      height: 80vh;
    }
    .controls {
      padding: 1rem;
    }
    .control-group {
      margin-bottom: 0.5rem;
    }
    label {
      display: block;
      margin-bottom: 0.25rem;
    }
    input[type="range"] {
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="canvasContainer"></div>
  <div class="controls">
    <div class="control-group">
      <label for="power">Power (W)</label>
      <input type="range" id="power" min="500" max="5000" step="100" value="2500" />
    </div>
    <div class="control-group">
      <label for="speed">Speed (mm/s)</label>
      <input type="range" id="speed" min="1" max="30" step="1" value="15" />
    </div>
    <div class="control-group">
      <label for="angle">Angle (deg)</label>
      <input type="range" id="angle" min="-45" max="45" step="5" value="0" />
    </div>
    <div class="control-group">
      <label for="axisRatio">Axis Ratio</label>
      <input type="range" id="axisRatio" min="0.1" max="2" step="0.1" value="1" />
    </div>
    <div class="control-group">
      <label for="efficiency">Efficiency</label>
      <input type="range" id="efficiency" min="0.1" max="1" step="0.1" value="0.8" />
    </div>
  </div>
  <script>
    // Three.js scene setup
    const container = document.getElementById('canvasContainer');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    camera.position.set(0, 1, 5);
    controls.update();
    // Light
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7.5);
    scene.add(light);
    // Simple ground plane
    const planeGeometry = new THREE.PlaneGeometry(20, 20);
    const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x222222, side: THREE.DoubleSide });
    const plane = new THREE.Mesh(planeGeometry, planeMaterial);
    plane.rotation.x = - Math.PI / 2;
    scene.add(plane);
    // Placeholder for heat source geometry (sphere)
    const sphereGeometry = new THREE.SphereGeometry(0.1, 32, 32);
    const sphereMaterial = new THREE.MeshStandardMaterial({ color: 0xff4500 });
    const source = new THREE.Mesh(sphereGeometry, sphereMaterial);
    scene.add(source);
    // Update function (simplified placeholder)
    function updateSimulation() {
      const power = parseFloat(document.getElementById('power').value);
      const speed = parseFloat(document.getElementById('speed').value);
      const angle = parseFloat(document.getElementById('angle').value) * Math.PI / 180;
      const axisRatio = parseFloat(document.getElementById('axisRatio').value);
      const efficiency = parseFloat(document.getElementById('efficiency').value);
      // Simplified visual update: move source based on speed and angle
      const time = Date.now() * 0.001;
      source.position.x = Math.cos(angle) * speed * time * 0.01;
      source.position.z = Math.sin(angle) * speed * time * 0.01;
      source.scale.set(1, 1, axisRatio);
      source.material.color.setHSL(0.05, 1, Math.max(0.3, efficiency));
    }
    // Event listeners for controls
    document.querySelectorAll('input[type="range"]').forEach(inp => {
      inp.addEventListener('input', updateSimulation);
    });
    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
    // Initial update
    updateSimulation();
  </script>
</body>
</html>
